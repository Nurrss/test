name: Supabase keep-alive

# Free-tier Supabase projects are paused after a period without activity.
# The old ping (anon SELECT on exam_variants) returned an empty result under
# RLS and did not count — the project paused 2 days after a successful ping.
# Now, every day:
#   1. If SUPABASE_ACCESS_TOKEN is set and the project is paused, restore it
#      via the Management API and wait until it is healthy again.
#   2. Write a heartbeat row through keepalive_ping() (patch 11) and hit the
#      Auth and Storage APIs, so there is real activity across services.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Restore the project if it was paused
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping auto-restore"
            exit 0
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          api="https://api.supabase.com/v1/projects/$ref"
          status() { curl -sf "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r .status; }
          s=$(status)
          echo "Project status: $s"
          if [ "$s" = "INACTIVE" ]; then
            echo "Project is paused — restoring"
            curl -sf -X POST "$api/restore" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          fi
          for i in $(seq 1 40); do
            s=$(status)
            [ "$s" = "ACTIVE_HEALTHY" ] && { echo "Project healthy"; exit 0; }
            echo "Waiting ($s)..."
            sleep 15
          done
          echo "Project did not become healthy in time (status: $s)"
          exit 1

      - name: Write heartbeat and touch Auth/Storage
        run: |
          call() {
            curl -s -o /tmp/body -w "%{http_code}" --retry 5 --retry-delay 15 --retry-all-errors "$@" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          }
          code=$(call -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" -H "Content-Type: application/json" -d '{}')
          echo "keepalive_ping: HTTP $code $(cat /tmp/body)"
          test "$code" = "200"
          echo "auth health: HTTP $(call "$SUPABASE_URL/auth/v1/health")"
          echo "storage: HTTP $(call -X POST "$SUPABASE_URL/storage/v1/object/list/listening-audio" -H "Content-Type: application/json" -d '{"prefix":"","limit":1}')"
